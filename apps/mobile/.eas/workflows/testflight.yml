name: Build and upload iOS to TestFlight

on:
  push:
    branches: ['main']
    paths:
      - apps/mobile/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

jobs:
  build_ios:
    name: Build production iOS app
    type: build
    environment: production
    env:
      EXPO_NO_CAPABILITY_SYNC: '1'
    params:
      platform: ios
      profile: production

  upload_testflight:
    name: Upload build to TestFlight
    type: submit
    needs: [build_ios]
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
